## The site shares the trend.* family look: the kit (kit/, a vendored copy
## synced from AustralianAntarcticDivision/trend by tools/kit-sync) gives
## the header, tabs and type. The kit pages (index.html = the S2 cell
## explorer, status.html, mechanics.html) are plain HTML copied into the
## build as resources; the .qmd pages render in the kit look (Quarto's own
## theme and navbar off; the tab list is site.js).
project:
  type: website
  output-dir: _site
  resources:
    - index.html
    - status.html
    - mechanics.html
    - site.js
    - kit/**
    - data/**

website:
  title: "trend.ice"
  description: "Southern Ocean sea ice on S2 cells, sea ice seasonality and the ice-edge bloom"

format:
  html:
    theme: none
    minimal: true
    toc: false
    fig-align: center
    css: [kit/trend.css, kit/quarto.css]
    include-in-header: _kit/head.html
    include-before-body: _kit/before.html
    include-after-body: _kit/after.html
